<x-dc>
<helmet>
<style>
@keyframes birdieIn{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
@keyframes birdieDot{0%,80%,100%{opacity:.25}40%{opacity:1}}
[data-birdie-panel]{animation:birdieIn .28s cubic-bezier(.2,.8,.2,1)}
[data-birdie-dot]{animation:birdieDot 1.2s infinite}
[data-birdie-list]::-webkit-scrollbar{width:8px}
[data-birdie-list]::-webkit-scrollbar-thumb{background:#DBD6CC;border:2px solid #FFFDF9;border-radius:8px}
@media (max-width:640px){[data-birdie-panel]{left:12px!important;right:12px!important;width:auto!important;bottom:120px!important;max-height:calc(100vh - 150px)!important}[data-birdie-nudge]{display:none!important}}

<style>

:root{--rm-space-1:8px;--rm-space-2:16px;--rm-space-3:24px;--rm-space-4:32px;--rm-space-5:48px;--rm-space-6:72px}

:where(button,a){-webkit-tap-highlight-color:transparent}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto!important}*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
@media(max-width:640px){:where(p,li){overflow-wrap:break-word}}
</style>
</helmet>

            <div style="align-self:flex-start;max-width:86%;background:#F1ECE3;padding:10px 13px;border-radius:14px 14px 14px 4px;font-size:14px;line-height:1.5;white-space:pre-wrap;text-wrap:pretty">{{ m.text }}</div>

          </div>
        </sc-if>

class Component extends DCLogic {
  state = {
    voice: (() => { try { return localStorage.getItem('birdie-voice') === '1'; } catch (e) { return false; } })(),
    open: false, nudge: true, dragging: false, pos: (() => { try { return JSON.parse(localStorage.getItem('birdie-pos')) || null; } catch (e) { return null; } })(), draft: '', thinking: false,
    messages: [{ role: 'assistant', text: "Tweet! I'm Birdie. I know Ritwika's projects, experience and background. What would you like to know?" }]
  };
  mouse = { x: 0, y: 0 };
  pos() {
    const W = window.innerWidth, H = window.innerHeight, p = this.state.pos;
    const x = p ? p.x : W - 132, y = p ? p.y : H - 132 - 64;
    return { x: Math.max(0, Math.min(W - 120, x)), y: Math.max(0, Math.min(H - 132, y)) };
  }
  hop = 0;

  componentDidMount() {
    this.initBird();
    this.onMove = e => {
      const r = this.mount && this.mount.getBoundingClientRect(); if (!r) return;
      this.mouse.x = Math.max(-1, Math.min(1, (e.clientX - (r.left + r.width / 2)) / 500));
      this.mouse.y = Math.max(-1, Math.min(1, (e.clientY - (r.top + r.height / 2)) / 500));
    };
    window.addEventListener('mousemove', this.onMove);
    this.onResize = () => this.forceUpdate();
    window.addEventListener('resize', this.onResize);
    setTimeout(() => this.buildContext(), 1200);
  }
  componentWillUnmount() {
    cancelAnimationFrame(this.raf);
    window.removeEventListener('mousemove', this.onMove);
    window.removeEventListener('resize', this.onResize);
    if (this.renderer) this.renderer.dispose();
    try { this.conv && this.conv.endSession(); } catch (e) {}
  }
  componentDidUpdate() { if (this.list) this.list.scrollTop = this.list.scrollHeight; }

  async buildContext() {
    const clean = s => (s || '').replace(/\s+/g, ' ').trim();
    let page = clean(document.body.innerText).slice(0, 14000);
    const cases = ['CaseCadence', 'CaseVWR', 'CaseEvoDrive', 'CasePosterStudio', 'CaseWeb3', 'CaseIncidentBriefing'];
    const parts = await Promise.all(cases.map(async n => {
      try {
        const html = await (await fetch('./' + n + '.dc.html')).text();
        const doc = new DOMParser().parseFromString(html, 'text/html');
        doc.querySelectorAll('script,style,helmet').forEach(x => x.remove());
        const root = doc.querySelector('x-dc') || doc.body;
        return '### Case study: ' + n.replace('Case', '') + '\n' + clean(root.textContent).slice(0, 6000);
      } catch (e) { return ''; }
    }));
    this.context = '## Portfolio home page\n' + page + '\n\n' + parts.filter(Boolean).join('\n\n');
  }

## Purpose
You are Ritwika Mondal's portfolio assistant.

Your job is to help recruiters, hiring managers, designers, engineers, and collaborators quickly understand:
- who Ritwika is professionally
- what she does
- what she has worked on
- what skills and tools she uses
- how she approaches product design, AI adoption, automation, and business integration
- the thinking behind her portfolio projects

You are not a generic chatbot. You represent Ritwika's professional portfolio.

---

## Professional Profile
Ritwika Mondal is a Product / UX / UI Designer with a computer science background and a Master's degree in Visual & Experience Design.

Her experience spans:
- enterprise software
- eCommerce
- automotive digital experiences
- design systems

Workflow:

## Technical Understanding
Ritwika does not position herself as a senior software engineer.

She understands technical concepts at a practical integration level, including:
- APIs
- JSON
- HTTP requests
- workflow orchestration
- local LLMs
- Docker concepts

When answering technical questions, emphasize practical understanding and learning ability rather than deep infrastructure expertise.

---

## How Ritwika Uses AI
Ritwika uses AI as a working and learning tool.

Tools may include:
- ChatGPT
- Claude
- Cursor
- n8n
- AI prototyping tools

Typical uses:
- research
- brainstorming
- coding assistance
- debugging
- workflow creation
- prompt engineering
- documentation
- prototyping

Do not hide the use of AI assistance.

Preferred framing:
"Ritwika uses AI-assisted development to move faster, while focusing on understanding the architecture, business logic, data flow, and decisions behind what she builds."

---

## AI Adoption Approach
When discussing AI adoption, use this framework:

1. Understand the business process.
2. Identify the actual problem.
3. Decide whether AI is appropriate.
4. Understand the data involved.
5. Prototype the smallest useful solution.
6. Validate the output.
7. Consider privacy, security, and governance.
8. Introduce human review where necessary.
9. Measure whether the solution improves the process.
10. Iterate.

Do not present AI as the answer to every problem.

---

## Recruiter Q&A

### Who is Ritwika?
Ritwika Mondal is a Product and UX/UI Designer with a computer science background and a Master's in Visual & Experience Design. Her experience spans enterprise software, eCommerce, automotive digital products, design systems, and more recently AI-enabled workflows and automation.

### What kind of roles is she interested in?
Ritwika is interested in roles where product thinking meets technology and business processes, including Product/UX, AI adoption, business integration, AI-enabled workflow design, product systems, and process automation.

### Is she a developer?
Ritwika's primary background is product and UX design, supported by a computer science foundation. She is comfortable working with APIs, workflow automation, AI tools, basic SQL/Python, and system logic, but does not position herself as a traditional software engineer.

### What did she build with n8n?
Ritwika built an AI Incident Briefing Automation prototype that takes structured incident records from Excel, prepares and aggregates the data in n8n, sends the context to a locally hosted Llama 3.2 model through Ollama, and converts the model response into an executive briefing.

### Why use a local LLM?
The local setup allowed Ritwika to explore model integration without automatically sending operational data to an external cloud model. It also helped her understand model serving, API integration, Docker networking, inference constraints, and governance considerations.

### What challenges did she face?
During the AI workflow project, she encountered JSON formatting errors, networking issues between Docker and Ollama, SQLite permission problems, and model inference timeouts. She debugged the system layer by layer.

### What did she learn?
A key learning was that AI automation is not just about writing a prompt. It involves data preparation, orchestration, APIs, validation, failure handling, governance, and creating a useful business output.

---

- concise
- conversational
- professional
- factual
- confident without exaggeration

3. the approach
4. the outcome

- companies
- job titles
- metrics
- skills
- technologies
- client names
- project outcomes

- the current AI project is multi-agent
- Ritwika wrote every line of code manually
- AI assistance means a lack of understanding

Never reveal private personal information.

Only discuss professional information intended for the portfolio.

---

## Fallback Behavior
If a recruiter asks something not covered in the portfolio:
1. Say the information is not available.
2. Offer the closest relevant professional information.
3. Suggest contacting Ritwika directly for clarification.

Example:
"I don't have that detail in Ritwika's portfolio, but I can explain the relevant project or skill area."

- Tell me about Ritwika.
- What did she work on at Volkswagen R?

- What challenges did she solve in the n8n project?

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
    renderer.setSize(W, H);
    renderer.domElement.style.cssText = 'width:100%;height:100%;display:block';
    el.appendChild(renderer.domElement);
    this.renderer = renderer;
    new ResizeObserver(() => { const w = el.clientWidth, h = el.clientHeight; if (w && h) { renderer.setSize(w, h); cam.aspect = w / h; cam.updateProjectionMatrix(); } }).observe(el);

    const scene = new THREE.Scene();
    const cam = new THREE.PerspectiveCamera(30, W / H, 0.1, 100);
    cam.position.set(0, 0.5, 8); cam.lookAt(0, -0.1, 0);
    scene.add(new THREE.HemisphereLight(0xffffff, 0xd9cfbf, 1.5));
    const key = new THREE.DirectionalLight(0xffffff, 1.7); key.position.set(2.5, 3, 4); scene.add(key);
    const rim = new THREE.DirectionalLight(0xffe7cc, 0.6); rim.position.set(-3, 1, -2); scene.add(rim);

    const M = (c, r = 0.5, m = 0) => new THREE.MeshStandardMaterial({ color: c, roughness: r, metalness: m });
    const silver = M(0xBFC4CB, 0.42, 0.15), silverD = M(0xA9AEB6, 0.5, 0.15), orange = M(0xF0A21C, 0.4), mouthM = M(0x7A2412, 0.6), ink = M(0x0E0E0E, 0.15), white = M(0xffffff, 0.2), capM = M(0x151515, 0.55);
    const S = (r, m, seg = 40) => new THREE.Mesh(new THREE.SphereGeometry(r, seg, seg), m);
    const root = new THREE.Group(); scene.add(root);
    const sh = document.createElement('canvas'); sh.width = sh.height = 128;
    const sx = sh.getContext('2d'), gr = sx.createRadialGradient(64, 64, 4, 64, 64, 64);
    gr.addColorStop(0, 'rgba(26,24,20,.28)'); gr.addColorStop(1, 'rgba(26,24,20,0)'); sx.fillStyle = gr; sx.fillRect(0, 0, 128, 128);
    const shadow = new THREE.Mesh(new THREE.PlaneGeometry(2.6, 0.9), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(sh), transparent: true, depthWrite: false }));
    shadow.rotation.x = -Math.PI / 2; shadow.position.y = -1.42; root.add(shadow);
    const bird = new THREE.Group(); root.add(bird);
    const body = S(0.92, silver); body.position.y = -0.35; body.scale.set(1, 0.92, 0.9); bird.add(body);
    const head = new THREE.Group(); head.position.set(0, 0.62, 0.05); bird.add(head);
    const skull = S(0.8, silver); skull.scale.set(1, 0.95, 0.92); head.add(skull);
    const eyes = [];
    for (const s of [-1, 1]) {
      const g = new THREE.Group(); g.position.set(s * 0.3, 0.02, 0.62); g.rotation.y = s * 0.35; head.add(g);
      const e = S(0.21, ink); e.scale.set(0.9, 1.1, 0.55); g.add(e);
      const h1 = S(0.055, white); h1.position.set(0.06, 0.08, 0.11); g.add(h1);
      const h2 = S(0.025, white); h2.position.set(-0.05, -0.08, 0.11); g.add(h2);
      eyes.push(g);
    }
    const beak = S(0.2, orange); beak.scale.set(1.25, 0.5, 0.8); beak.position.set(0, -0.27, 0.72); head.add(beak);
    const beakLow = new THREE.Group(); beakLow.position.set(0, -0.36, 0.66); head.add(beakLow);
    const mouth = S(0.17, mouthM); mouth.scale.set(1, 0.9, 0.5); mouth.position.y = -0.04; beakLow.add(mouth);
    const cap = new THREE.Group(); cap.position.set(0, 0.32, -0.02); cap.rotation.x = -0.18; head.add(cap);
    const dome = new THREE.Mesh(new THREE.SphereGeometry(0.78, 40, 20, 0, Math.PI * 2, 0, Math.PI / 2), capM); dome.scale.set(1.02, 0.72, 1); cap.add(dome);
    const brim = new THREE.Mesh(new THREE.CylinderGeometry(0.62, 0.62, 0.05, 40, 1, false, -Math.PI / 2 - 0.9, 1.8), capM); brim.scale.set(1.15, 1, 1.05); brim.position.set(0, 0.02, 0.32); brim.rotation.x = 0.12; cap.add(brim);
    const band = new THREE.Mesh(new THREE.TorusGeometry(0.79, 0.018, 8, 60, Math.PI * 0.8), white); band.rotation.set(Math.PI / 2, 0, Math.PI * 0.1); band.position.y = 0.05; band.scale.set(1.02, 1, 1); cap.add(band);
    const lc = document.createElement('canvas'); lc.width = 256; lc.height = 128;
    const lx = lc.getContext('2d'); lx.fillStyle = '#fff'; lx.font = "700 58px 'Hanken Grotesk', sans-serif"; lx.textAlign = 'center'; lx.textBaseline = 'middle'; lx.letterSpacing = '12px'; lx.fillText('', 134, 68);
    const logo = new THREE.Mesh(new THREE.PlaneGeometry(0.54, 0.27), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(lc), transparent: true }));
    logo.position.set(0, 0.3, 0.73); logo.rotation.x = -0.45; cap.add(logo);
    const wings = [];
    for (const s of [-1, 1]) {
      const pivot = new THREE.Group(); pivot.position.set(s * 0.82, -0.2, 0); bird.add(pivot);
      const w = S(1, silverD); w.scale.set(0.2, 0.48, 0.42); w.position.set(s * 0.14, -0.3, 0); w.rotation.z = s * 0.5; pivot.add(w);
      wings.push({ pivot, s });
    }
    const tail = new THREE.Group(); bird.add(tail);
    for (const s of [-1, 1]) {
      const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.34, 10), orange);
      leg.position.set(s * 0.3, -1.25, 0.2); leg.rotation.z = s * 0.45; bird.add(leg);
    }
    root.rotation.y = -0.3;

    const clock = new THREE.Clock();
    let nextBlink = 2, headY = 0, headX = 0;
    const loop = () => {
      this.raf = requestAnimationFrame(loop);
      const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
      const busy = this.state.thinking, open = this.state.open;
      this.hop = Math.max(0, this.hop - dt * 1.8);
      const hopY = Math.sin(this.hop * Math.PI) * 0.45;
      bird.position.y = Math.sin(t * 2.2) * 0.05 + hopY;
      bird.scale.y = 1 + Math.sin(t * 2.2 + 1) * 0.015;
      const flapAmp = this.state.dragging ? 1 : busy ? 0.7 : this.hop > 0 ? 0.9 : 0.08;
      const flapSpd = this.state.dragging ? 24 : busy ? 18 : this.hop > 0 ? 22 : 2.2;
      for (const w of wings) w.pivot.rotation.z = w.s * (0.1 + (0.5 + 0.5 * Math.sin(t * flapSpd)) * flapAmp);
      const tx = open ? -0.35 : this.mouse.x * 0.8, ty = open ? 0.1 : this.mouse.y * 0.45;
      headY += (tx - headY) * 0.08; headX += (ty - headX) * 0.08;
      head.rotation.y = headY; head.rotation.x = headX + (busy ? Math.sin(t * 6) * 0.08 : 0);
      head.rotation.z = busy ? Math.sin(t * 3) * 0.12 : Math.sin(t * 0.9) * 0.04;
      beakLow.scale.y = busy ? 0.6 + 0.6 * (0.5 + 0.5 * Math.sin(t * 14)) : 1;
      shadow.scale.setScalar(1 - hopY * 0.5); shadow.material.opacity = 1 - hopY;
      nextBlink -= dt;
      const bk = nextBlink < 0 ? Math.max(0.08, Math.abs(nextBlink + 0.07) / 0.07) : 1;
      if (nextBlink < -0.14) nextBlink = 2 + Math.random() * 3;
      eyes.forEach(e => (e.scale.y = bk));
      renderer.render(scene, cam);
    };
    loop();
  }

  renderVals() {
    const { open, nudge, messages, thinking, draft } = this.state;
    const PAGE_QS = {
      vwr: ['What was her role on Virtual Studio?', 'What problem did it solve?', 'What were the results?', 'How did she handle accessibility?'],
      poster: ['What is the Poster Studio?', 'What was her contribution?', 'What was the design challenge?', 'Is it live?'],
      cadence: ['What is Cuboids?', 'What impact did the design system have?', 'How did she handle accessibility?', 'How did she work with developers?'],
      shop: ['What is Cadence Shop?', 'What problem did it solve?', 'What were the outcomes?', 'How was accessibility handled?'],
      evo: ['What is Evo Drive?', 'How did she research it?', 'What makes it different?', 'What did she learn?'],
      incident: ['Explain this workflow', 'Why use a local LLM?', 'What challenges did she face?', 'Is this production-ready?'],
      skills: ["What is Ritwika's biggest achievement?", 'What is her tech stack?', 'How does she work with developers?', 'How does she use AI tools?']
    };
    const qs = PAGE_QS[this.props.page] || ["What is Ritwika's biggest achievement?", 'Tell me about Ritwika', 'What did she work on at Volkswagen R?', 'Explain the AI Incident Briefing Automation', 'What technical skills does she have?', 'How does she approach AI adoption?', 'What roles is she looking for?'];
    return {
      toggleVoice: this.toggleVoice,
      toggleCall: this.toggleCall,
      hasAgent: !!Component.AGENT_ID,
      callText: ({ connecting: 'CONNECTING…', listening: '● LISTENING · END', speaking: '● SPEAKING · END' })[this.state.call] || '◉ TALK',
      callBg: this.state.call ? '#C4361D' : 'transparent',
      callFg: this.state.call ? '#FFFFFF' : '#1A1814',
      voiceText: this.state.voice ? '♪ VOICE ON' : 'VOICE OFF',
      voiceLabel: this.state.voice ? 'Mute Birdie' : 'Let Birdie speak',
      voiceBg: this.state.voice ? '#1A1814' : 'transparent',
      voiceFg: this.state.voice ? '#F7F4EF' : '#6B665C',
      open, thinking, draft,
      ...(() => {
        const { x, y } = this.pos(), W = window.innerWidth, H = window.innerHeight;
        const right = x + 60 > W / 2, below = y + 66 > H / 2;
        return {
          stageLeft: x, stageTop: y, stageCursor: this.state.dragging ? 'grabbing' : 'grab',
          nudgeRight: right ? W - x - 18 : Math.max(8, W - x - 120 - 190), nudgeTop: Math.max(12, y - 20),
          panelLeft: right ? 'auto' : Math.max(12, x) + 'px', panelRight: right ? Math.max(12, W - x - 120) + 'px' : 'auto',
          panelTop: below ? 'auto' : (y + 140) + 'px', panelBottom: below ? (H - y + 4) + 'px' : 'auto'
        };
      })(),
      onDown: e => {
        const { x, y } = this.pos();
        this.drag = { sx: e.clientX, sy: e.clientY, ox: x, oy: y, moved: false };
        e.currentTarget.setPointerCapture(e.pointerId);
      },
      onDragMove: e => {
        const d = this.drag; if (!d) return;
        const dx = e.clientX - d.sx, dy = e.clientY - d.sy;
        if (!d.moved && Math.hypot(dx, dy) < 5) return;
        d.moved = true;
        this.setState({ dragging: true, nudge: false, pos: { x: d.ox + dx, y: d.oy + dy } });
      },
      onUp: () => {
        const d = this.drag; this.drag = null; if (!d) return;
        if (d.moved) { this.setState({ dragging: false }); try { localStorage.setItem('birdie-pos', JSON.stringify(this.pos())); } catch (e) {} }
        else { this.bling(); this.hop = 1; this.setState(s => ({ open: !s.open, nudge: false })); }
      },
      showNudge: nudge && !open,
      showSuggestions: messages.length <= 1 && !thinking,
      messages: messages.map(m => ({ text: m.text, isBot: m.role === 'assistant', isUser: m.role === 'user', sources: m.sources || [], hasSources: !!(m.sources && m.sources.length) })),
      suggestions: qs.map(q => ({ label: q, ask: () => this.ask(q) })),
      setMount: el => { this.mount = el; },
      setList: el => { this.list = el; },
      toggle: () => { this.bling(); this.hop = 1; this.setState(s => ({ open: !s.open, nudge: false })); },
      onDraft: e => this.setState({ draft: e.target.value }),
      onKey: e => { if (e.key === 'Enter') this.ask(this.state.draft); },
      send: () => this.ask(this.state.draft)
    };
  }
}
